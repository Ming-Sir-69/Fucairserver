name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: msys
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          cache: false
      - name: Restore pinned dependencies and upstream source
        shell: pwsh
        env:
          FUCAIRSERVER_MSYS_ROOT: ${{ steps.msys.outputs.msys2-location }}
        run: ./scripts/Initialize-Build.ps1 -InstallPackages -IncludeMiracast -IncludeInstaller
      - name: Build public executables
        shell: pwsh
        env:
          FUCAIRSERVER_MSYS_ROOT: ${{ steps.msys.outputs.msys2-location }}
        run: |
          ./scripts/Build.ps1 -PublicBuild -Parallel 4
          ./scripts/Build-Miracast.ps1 -PublicBuild -Parallel 2
      - name: Native regression tests
        shell: pwsh
        env:
          FUCAIRSERVER_MSYS_ROOT: ${{ steps.msys.outputs.msys2-location }}
        run: |
          . ./scripts/Set-BuildEnvironment.ps1
          & "$env:FUCAIRSERVER_MSYS_ROOT/ucrt64/bin/ctest.exe" --test-dir build/native-public --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed' }
      - name: Package and compile installer
        shell: pwsh
        env:
          FUCAIRSERVER_MSYS_ROOT: ${{ steps.msys.outputs.msys2-location }}
        run: |
          node scripts/Package.mjs dist/packages/public --public
          if ($LASTEXITCODE -ne 0) { throw 'Public packaging failed' }
          ./scripts/Build-Installer.ps1 -PayloadDir "$PWD/dist/packages/public" -OutputDir "$PWD/dist/release"
      - name: Gather complete corresponding source and release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and VERSION disagree' }
          ./scripts/New-ReleaseArtifacts.ps1 -PayloadDir "$PWD/dist/packages/public" -OutputDir "$PWD/dist/release" -SkipRuntimeSources
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  installer:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release
          path: dist/release
      - name: Install, activate, repair while running and uninstall
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem dist/release/*-setup.exe)
          if ($installer.Count -ne 1) { throw 'Expected one installer' }
          ./scripts/Test-Installer.ps1 -Installer $installer[0].FullName

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, installer]
    runs-on: windows-2025
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release
          path: dist/release
      - name: Add hash-verified corresponding runtime source
        shell: pwsh
        run: |
          ./scripts/Get-SourceArchives.ps1
          ./scripts/Add-RuntimeSourceArtifact.ps1 -OutputDir "$PWD/dist/release"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/*
      - name: Publish preview release after all gates pass
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist/release/* -File).FullName --verify-tag --prerelease --title "Fucairserver $((Get-Content VERSION -Raw).Trim()) Preview" --notes-file docs/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
